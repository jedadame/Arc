              </div>
              <div style={{ display: "flex", justifyContent: "space-around" }}>
                <div style={{ textAlign: "center" }}><div style={{ fontSize: 13, fontWeight: 800, color: C.yellow }}>{day.mood}/10</div><div style={{ fontSize: 9, color: C.textDim, marginTop: 2 }}>Mood</div></div>
                <div style={{ textAlign: "center" }}><div style={{ fontSize: 13, fontWeight: 800, color: C.green }}>{day.summary}</div><div style={{ fontSize: 9, color: C.textDim, marginTop: 2 }}>Habits</div></div>
              </div>
            </div>
          );
        })()}
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 6 }}>
        {[["🔥", "Best streak", "—"], ["✅", "All habits hit", "—"], ["⚡", "Completion rate", "—"], ["📈", "vs last month", "—"]].map(([ic, l, v]) => (
          <div key={l} style={{ background: C.bgCard, border: `1px solid ${C.border}`, borderRadius: 12, padding: "12px 14px" }}>
            <div style={{ fontSize: 18, marginBottom: 4 }}>{ic}</div>
            <div style={{ fontSize: 13, fontWeight: 700 }}>{v}</div>
            <div style={{ fontSize: 10, color: C.textDim, marginTop: 2 }}>{l}</div>
          </div>
        ))}
      </div>

      {/* ── Habits management ── */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 22, marginBottom: 10 }}>
        <Label>Manage Habits</Label>
        <button onClick={() => setManageHabits(m => !m)} style={manageBtnStyle(manageHabits)}>{manageHabits ? "Done" : "Edit"}</button>
      </div>
      <Card>
        <div ref={habitReorder.containerRef}>
        {habits.map((h, i) => (
          <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: i < habits.length - 1 ? `1px solid ${C.border}` : "none", ...habitReorder.rowStyle(i) }}>
            {manageHabits ? (
              <>
                <DragHandle onPointerDown={habitReorder.startDrag(i)} />
                <input value={h.icon} onChange={e => updateHabit(h.id, "icon", e.target.value)} style={{ ...miniInputStyle, width: 40, textAlign: "center", padding: "6px 2px" }} />
                <input value={h.name} onChange={e => updateHabit(h.id, "name", e.target.value)} style={{ ...miniInputStyle, flex: 1 }} />
                <button onClick={() => deleteHabit(h.id)} style={{ background: "transparent", border: "none", color: C.red, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>×</button>
              </>
            ) : (
              <>
                <span style={{ fontSize: 18 }}>{h.icon}</span>
                <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 600 }}>{h.name}</div></div>
                <span style={{ fontSize: 11, color: C.yellow }}>🔥 {h.streak}d</span>
              </>
            )}
          </div>
        ))}
        </div>
        {habits.length === 0 && <div style={{ fontSize: 12, color: C.textDim, padding: "8px 0" }}>No habits yet — add one below.</div>}
        {manageHabits && (
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <input value={newHabitIcon} onChange={e => setNewHabitIcon(e.target.value)} placeholder="🔥" style={{ ...miniInputStyle, width: 44, textAlign: "center", padding: "9px 4px" }} />
            <input value={newHabitName} onChange={e => setNewHabitName(e.target.value)} onKeyDown={e => e.key === "Enter" && addHabit()} placeholder="New habit..." style={{ ...miniInputStyle, flex: 1, padding: "9px 12px" }} />
            <button onClick={addHabit} style={{ background: C.yellow, color: "#000", border: "none", borderRadius: 8, width: 36, fontWeight: 900, fontSize: 18, cursor: "pointer", flexShrink: 0 }}>+</button>
          </div>
        )}
      </Card>

      <HabitTracker habits={habits} journalEntries={journalEntries} />

      {/* ── Goals management + tracking — all pegged to the current quarter ── */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 22, marginBottom: 2 }}>
        <Label style={{ marginBottom: 0 }}>Q{CURRENT_QUARTER} Goals · {goals.filter(g => g.done).length}/{goals.length} complete</Label>
        <button onClick={() => setManageGoals(m => !m)} style={manageBtnStyle(manageGoals)}>{manageGoals ? "Done" : "Edit"}</button>
      </div>
      <div style={{ fontSize: 11, color: QUARTER_DAYS_LEFT <= 14 ? C.red : C.textDim, marginBottom: 10 }}>{QUARTER_DAYS_LEFT} days left in Q{CURRENT_QUARTER}</div>
      <div ref={goalReorder.containerRef}>
      {goals.map((g, i) => (
        <div key={g.id} style={{ background: C.bgCard, border: `1px solid ${g.done ? g.color + "55" : C.border}`, borderRadius: 12, padding: "12px 14px", marginBottom: 8, ...goalReorder.rowStyle(i) }}>
          {manageGoals ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <DragHandle onPointerDown={goalReorder.startDrag(i)} />
                <input value={g.text} onChange={e => updateGoal(g.id, "text", e.target.value)} style={{ ...miniInputStyle, flex: 1 }} />
              </div>
              <button onClick={() => deleteGoal(g.id)} style={{ alignSelf: "flex-end", background: "transparent", border: "none", color: C.red, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Delete</button>
            </div>
          ) : (
            <>
              <div className="row-tap" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4, padding: "2px 4px", margin: "0 -4px 4px" }} onClick={() => toggleGoalDone(g.id)}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: g.done ? C.green : g.color, flexShrink: 0 }} />
                <span style={{ fontSize: 14, fontWeight: 700, flex: 1, textDecoration: g.done ? "line-through" : "none", color: g.done ? C.green : C.text, cursor: "pointer" }}>{g.done ? "🥳 " : ""}{g.text}</span>
                <div className="goal-check" style={{ width: 26, height: 26, borderRadius: 8, border: `2px solid ${g.done ? C.green : C.borderMid}`, background: g.done ? C.green : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, cursor: "pointer" }}>
                  {g.done && <span style={{ fontSize: 14, color: "#000", fontWeight: 900, lineHeight: 1 }}>✓</span>}
                </div>
              </div>
              <div style={{ fontSize: 10, color: g.done ? C.textDim : (QUARTER_DAYS_LEFT <= 14 ? C.red : C.textDim), marginTop: 2 }}>{g.done ? "Completed" : `${QUARTER_DAYS_LEFT} days left in Q${CURRENT_QUARTER}`}</div>
            </>
          )}
        </div>
      ))}
      </div>
      {goals.length === 0 && !manageGoals && <div style={{ fontSize: 12, color: C.textDim, marginBottom: 8 }}>No goals yet — tap Edit to add some.</div>}
      {manageGoals && (
        <Card>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <input value={newGoalText} onChange={e => setNewGoalText(e.target.value)} onKeyDown={e => e.key === "Enter" && addGoal()} placeholder="New goal..." style={{ ...miniInputStyle, padding: "9px 12px" }} />
            <div style={{ fontSize: 11, color: C.textDim }}>Every goal runs through the end of Q{CURRENT_QUARTER} — {QUARTER_DAYS_LEFT}d left. No numbers to fuss with, just mark it done.</div>
            <button onClick={addGoal} style={{ background: C.yellow, color: "#000", border: "none", borderRadius: 8, padding: "9px 0", fontWeight: 800, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>+ Add Goal</button>
          </div>
        </Card>
      )}

      <SL>Mood Trend</SL>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <select value={moodRange} onChange={e => setMoodRange(+e.target.value)} style={selectStyle}>
            {RANGE_OPTIONS.map(o => <option key={o} value={o}>{o}D</option>)}
          </select>
          <Chip color={moodDelta >= 0 ? C.green : C.red} size={11}>{moodDelta >= 0 ? "+" : ""}{moodDelta} vs start</Chip>
        </div>
        <div style={{ fontSize: 22, fontWeight: 900, marginBottom: 8 }}>{moodAvg} <span style={{ fontSize: 12, color: C.textMid, fontWeight: 400 }}>avg</span></div>
        <InteractiveChart data={moodData} valueKey="mood" color={C.yellow} height={56} unit="/10" />
      </Card>

      <SL>Bodyweight</SL>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <select value={weightRange} onChange={e => setWeightRange(+e.target.value)} style={selectStyle}>
            {RANGE_OPTIONS.map(o => <option key={o} value={o}>{o}D</option>)}
          </select>
          <Chip color={weightStatus.color} size={11}>{weightData.length ? `${weightStatus.label} (${weightDelta >= 0 ? "+" : ""}${weightDelta} lbs)` : weightStatus.label}</Chip>
        </div>
        <div style={{ fontSize: 28, fontWeight: 900, marginBottom: 8 }}>{weightData.length ? weightData[weightData.length - 1].weight : "—"} <span style={{ fontSize: 14, color: C.textMid, fontWeight: 400 }}>lbs</span></div>
        <InteractiveChart data={weightData} valueKey="weight" color={C.blue} height={56} unit=" lbs" />
      </Card>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = "discipline-app-v1";
const DRAFT_KEY = "discipline-app-draft-v1";
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    p.journalEntries = (p.journalEntries || []).map(e => ({ ...e, date: new Date(e.date) }));
    p.weightHistory = (p.weightHistory || []).map(w => ({ ...w, date: new Date(w.date) }));
    return p;
  } catch { return null; }
}
// Today's in-progress Home tab state (tasks, mood, draft journal text, weight
// input, habit checkmarks) used to live only in memory and vanished the moment
// the app was closed. This loads it back from local storage — but only if it
// was written today; a draft from a previous day is stale and ignored, so a
// new day still starts with a clean slate.
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d.day !== TODAY.toDateString()) return null;
    return d;
  } catch { return null; }
}

function App() {
  const saved = loadSaved();
  const [tab, setTab] = useState("home");
  const [goals, setGoals] = useState(saved?.goals ?? INIT_GOALS);
  const [habits, setHabits] = useState(saved?.habits ?? INIT_HABITS);
  const [journalEntries, setJournalEntries] = useState(saved?.journalEntries ?? []);
  const [weightHistory, setWeightHistory] = useState(saved?.weightHistory ?? []);
  const [identity, setIdentity] = useState(saved?.identity ?? { why: "", mission: "" });
  const [settings, setSettings] = useState(saved?.settings ?? { voice: true, photo: true, journalPhoto: true, video: true, music: true });
  const [showSettings, setShowSettings] = useState(false);
  const [jump, setJump] = useState(null); // { date, fromHome }

  // Persist everything durable (habits, goals, entries, weigh-ins, mission,
  // settings) to this device's local storage on every change, so it survives
  // a refresh or fully closing the app. The in-progress "today" draft on the
  // Home tab (unsaved tasks/mood/journal text) is intentionally left out —
  // it's finalized by hitting Save, same as before.
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ goals, habits, journalEntries, weightHistory, identity, settings })); } catch {}
  }, [goals, habits, journalEntries, weightHistory, identity, settings]);

  const goToDay = (d) => { setJump({ date: d, fromHome: true }); setTab("journal"); };

  // Upsert-by-day: saving twice in one day updates that day's record instead
  // of creating a duplicate entry/weigh-in.
  const addEntry = (entry) => setJournalEntries(es => { const i = es.findIndex(e => sameDay(e.date, entry.date)); if (i >= 0) { const c = [...es]; c[i] = entry; return c; } return [...es, entry]; });
  const addWeight = (w) => setWeightHistory(ws => { const i = ws.findIndex(x => sameDay(x.date, w.date)); if (i >= 0) { const c = [...ws]; c[i] = w; return c; } return [...ws, w]; });
  const deleteEntry = (id) => setJournalEntries(es => es.filter(e => e.id !== id));

  const TABS = [
    { key: "home", icon: "⚡", label: "Journal" },
    { key: "journal", icon: "📓", label: "Entries" },
    { key: "you", icon: "◎", label: "You" },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", maxWidth: 430, margin: "0 auto", fontFamily: "'Inter',system-ui,sans-serif", color: C.text, display: "flex", flexDirection: "column", paddingTop: "env(safe-area-inset-top,0px)" }}>
      <div style={{ flex: 1, overflowY: "auto", paddingBottom: 88, scrollbarWidth: "none" }}>
        {/* All three tabs stay mounted, just shown/hidden via display — this is
            what keeps a half-filled Home tab (tasks, draft journal, mood) intact
            when you switch away and back, instead of remounting from scratch. */}
        <div style={{ display: tab === "home" ? "block" : "none" }}>
          <HomeTab habits={habits} setHabits={setHabits} goals={goals} setGoals={setGoals} settings={settings} goToDay={goToDay} journalEntries={journalEntries} addEntry={addEntry} addWeight={addWeight} />
        </div>
        <div style={{ display: tab === "journal" ? "block" : "none" }}>
          <JournalTab entries={journalEntries} jump={jump} clearJump={() => setJump(null)} goHome={() => setTab("home")} deleteEntry={deleteEntry} />
        </div>
        <div style={{ display: tab === "you" ? "block" : "none" }}>
          <YouTab goals={goals} setGoals={setGoals} habits={habits} setHabits={setHabits} journalEntries={journalEntries} weightHistory={weightHistory} identity={identity} setIdentity={setIdentity} onOpenSettings={() => setShowSettings(true)} />
        </div>
      </div>

      <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "#0D0D0D", borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "space-around", alignItems: "center", padding: "10px 0 calc(22px + env(safe-area-inset-bottom,0px))", zIndex: 100 }}>
        {TABS.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, background: "none", border: "none", cursor: "pointer", padding: "4px 24px", color: tab === t.key ? C.yellow : C.textDim, transition: "color 0.15s" }}>
            <span style={{ fontSize: 22 }}>{t.icon}</span>
            <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em" }}>{t.label}</span>
          </button>
        ))}
      </nav>

      {showSettings && <SettingsPanel settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("service-worker.js").catch(() => {}); });
  }
</script>
</body>
</html>
